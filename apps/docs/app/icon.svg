<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="materializedcss">
  <title>materializedcss</title>
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4868a"/>
      <stop offset="1" stop-color="#e0484f"/>
    </linearGradient>
    <!-- Each face of the folded strip is shaded darker toward its crease. -->
    <linearGradient id="mz-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f1"/>
      <stop offset="1" stop-color="#f6c3c5"/>
    </linearGradient>
    <linearGradient id="mz-teal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2bbbad"/>
      <stop offset="1" stop-color="#1c8379"/>
    </linearGradient>
    <clipPath id="mz-tile"><rect width="128" height="128" rx="30"/></clipPath>
    <filter id="mz-z2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6d1a1f" flood-opacity=".35"/>
    </filter>
  </defs>

  <g clip-path="url(#mz-tile)">
    <rect width="128" height="128" fill="url(#mz-bg)"/>
    <!-- Waves: a ripple spreading out from a tap -->
    <g fill="none" stroke="#fff" stroke-width="3">
      <circle cx="106" cy="106" r="15" stroke-opacity=".28"/>
      <circle cx="106" cy="106" r="30" stroke-opacity=".16"/>
      <circle cx="106" cy="106" r="45" stroke-opacity=".08"/>
    </g>
    <circle cx="106" cy="106" r="5" fill="#fff" fill-opacity=".55"/>
  </g>

  <!-- The M: one strip of Material paper, folded three times, lifted at z-depth 2 -->
  <g filter="url(#mz-z2)">
    <path d="M26 96V34h16v62z" fill="#fff"/>
    <path d="M26 34h16l22 30v24z" fill="url(#mz-back)"/>
    <path d="M64 64l22-30h16L64 88z" fill="url(#mz-teal)"/>
    <path d="M86 34h16v62H86z" fill="#fff"/>
  </g>
</svg>
